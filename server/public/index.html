<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuctionLens Scan Log</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230b0c0f'/%3E%3Ccircle cx='14' cy='14' r='7.5' fill='none' stroke='%23c8783a' stroke-width='3'/%3E%3Cpath d='M19.5 19.5l6 6' stroke='%23c8783a' stroke-width='3.5' stroke-linecap='square'/%3E%3C/svg%3E">
<style>
/* The AuctionLens console look (AuctionLens/UI/Theme.lua). */
:root {
  --sunken: #07080a; --base: #0b0c0f; --raised: #121419;
  --ink: #d9dcdf; --ink-sec: #aab1b8; --ink-muted: #78808a; --ink-faint: #4b525b; --mark: #6b737c;
  --signal: #c8783a; --signal-soft: rgba(200, 120, 58, 0.14);
  --up: #55b3be; --good: #62ad7b; --down: #d05a66;
  --hairline: rgba(255, 255, 255, 0.085); --divider: rgba(255, 255, 255, 0.055);
  --hover: rgba(255, 255, 255, 0.04);
  --title: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, Consolas, monospace;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--base); color: var(--ink); font: 14px/1.5 var(--body); min-height: 100vh; }
[hidden] { display: none !important; }

header {
  display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 48px;
  background: var(--raised); border-bottom: 1px solid var(--hairline);
}
.mark { width: 10px; height: 10px; background: var(--signal); flex: none; }
.brand { font: 600 14px var(--title); letter-spacing: 0.16em; }
.sub { font: 600 12px var(--title); letter-spacing: 0.16em; color: var(--ink-muted); }
.spacer { flex: 1; }
#refreshed { font: 12px var(--mono); color: var(--ink-faint); }

main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }

.card { position: relative; background: var(--raised); border: 1px solid var(--divider); padding: 16px 18px 18px; min-width: 0; }
.card::before, .card::after {
  content: ""; position: absolute; width: 9px; height: 9px; border: solid rgba(255, 255, 255, 0.22); pointer-events: none;
}
.card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.card::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
h2 { margin: 0 0 12px; font: 600 12px var(--title); letter-spacing: 0.16em; color: var(--ink-sec); display: flex; gap: 10px; align-items: baseline; }
h2 .num { font: 12px var(--mono); color: var(--mark); letter-spacing: 0; }
h2 .count { margin-left: auto; font: 12px var(--mono); color: var(--ink-muted); letter-spacing: 0; }

/* Code entry */
#gate { max-width: 440px; width: 100%; margin: 8vh auto 0; }
#gate p { margin: 0 0 14px; color: var(--ink-muted); }
.row { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; padding: 9px 11px; background: var(--sunken); color: var(--ink);
  border: 1px solid var(--hairline); font: 16px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; outline: none;
}
input:focus { border-color: var(--signal); }
button {
  font: 600 12px var(--title); letter-spacing: 0.14em; cursor: pointer;
  padding: 0 16px; height: 40px; background: var(--signal-soft); color: var(--ink); border: 1px solid var(--signal);
}
button:hover { background: rgba(200, 120, 58, 0.26); }
button:disabled { opacity: 0.5; cursor: default; }
button.link { background: none; border: 0; height: auto; padding: 4px 0; color: var(--ink-muted); }
button.link:hover { color: var(--ink); background: none; }
.error { color: var(--down); margin-top: 10px; min-height: 1.5em; }

/* Group summary */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.stat .label { font-size: 12px; color: var(--ink-muted); }
.stat .value { font: 22px var(--mono); color: var(--ink); line-height: 1.3; }
.stat .value.name { font: 600 22px var(--title); letter-spacing: 0.03em; overflow-wrap: anywhere; }
.stat .note { font: 12px var(--mono); color: var(--ink-muted); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }

ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--divider); }
ul.plain li:first-child { border-top: 0; }
ul.plain .main { overflow-wrap: anywhere; }
ul.plain .side { font: 13px var(--mono); color: var(--ink-muted); white-space: nowrap; }

/* Scan log */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 600 11px var(--title); letter-spacing: 0.14em; color: var(--ink-muted); padding: 0 10px 8px 0; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--divider); vertical-align: top; }
tr:hover td { background: var(--hover); }
td.num, th.num { text-align: right; font-family: var(--mono); }
td.mono { font-family: var(--mono); color: var(--ink-sec); white-space: nowrap; }
td.market { overflow-wrap: anywhere; color: var(--ink-sec); }
.tag { display: inline-block; font: 600 10px var(--title); letter-spacing: 0.12em; padding: 1px 6px; border: 1px solid var(--hairline); color: var(--ink-muted); white-space: nowrap; }
.tag.full { border-color: var(--signal); color: var(--signal); }
.who { color: var(--ink); }
.who.anon { color: var(--ink-muted); font-style: italic; }
.empty { color: var(--ink-muted); padding: 18px 0 6px; }
@media (max-width: 560px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true"></span>
  <span class="brand">AUCTIONLENS</span>
  <span class="sub">SCAN LOG</span>
  <span class="spacer"></span>
  <span id="refreshed"></span>
</header>

<main>
  <section id="gate" class="card">
    <h2><span class="num">01</span>YOUR GUILD</h2>
    <p>Enter your group's join code to see who has synced and when.</p>
    <form id="gate-form" class="row" autocomplete="off">
      <input id="code" placeholder="ABCD-EFGH" maxlength="12" spellcheck="false" aria-label="Join code">
      <button id="go" type="submit">VIEW</button>
    </form>
    <div id="gate-error" class="error" role="alert"></div>
  </section>

  <section id="view" hidden>
    <div class="card" style="margin-bottom:14px">
      <h2><span class="num">01</span>GROUP<span class="count"><button id="forget" class="link" type="button">use another code</button></span></h2>
      <div class="summary">
        <div class="stat"><div class="label">Group</div><div id="s-group" class="value name"></div><div id="s-created" class="note"></div></div>
        <div class="stat"><div class="label">Members</div><div id="s-members" class="value"></div></div>
        <div class="stat"><div class="label">Items shared</div><div id="s-items" class="value"></div><div id="s-markets" class="note"></div></div>
        <div class="stat"><div class="label">Last upload</div><div id="s-last" class="value"></div><div id="s-last-who" class="note"></div></div>
      </div>
    </div>

    <div class="two" style="margin-bottom:14px">
      <div class="card">
        <h2><span class="num">02</span>MARKETS<span id="c-markets" class="count"></span></h2>
        <ul id="markets" class="plain"></ul>
      </div>
      <div class="card">
        <h2><span class="num">03</span>MEMBERS<span id="c-members" class="count"></span></h2>
        <ul id="members" class="plain"></ul>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">04</span>RECENT UPLOADS<span id="c-scans" class="count"></span></h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>When</th><th>Who</th><th class="hide-sm">Market</th><th class="num">Items</th><th>Kind</th><th class="hide-sm">Scanned</th>
          </tr></thead>
          <tbody id="scans"></tbody>
        </table>
      </div>
      <div id="scans-empty" class="empty" hidden></div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var KEY = "alens.scanlog.code";
  var $ = function (id) { return document.getElementById(id); };
  var code = "";
  var timer = null;

  function store(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function stored() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }

  function ago(t) {
    if (!t) return "never";
    var s = Math.max(0, Math.round(Date.now() / 1000 - t));
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }
  function stamp(t) { return t ? new Date(t * 1000).toLocaleString() : ""; }
  function n(x) { return (Number(x) || 0).toLocaleString(); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function who(label) {
    return el("span", label ? "who" : "who anon", label || "unnamed member");
  }

  function render(d) {
    $("gate").hidden = true;
    $("view").hidden = false;
    document.title = d.group + " - AuctionLens Scan Log";
    $("s-group").textContent = d.group;
    $("s-created").textContent = d.created ? "since " + new Date(d.created * 1000).toLocaleDateString() : "";
    $("s-members").textContent = n(d.members.length);
    var items = d.markets.reduce(function (a, m) { return a + m.items; }, 0);
    $("s-items").textContent = n(items);
    $("s-markets").textContent = d.markets.length === 1 ? "1 market" : d.markets.length + " markets";
    var last = d.scans[0];
    $("s-last").textContent = last ? ago(last.time) : "none yet";
    $("s-last").title = last ? stamp(last.time) : "";
    $("s-last-who").textContent = last ? (last.label || "unnamed member") : "";

    var mk = $("markets"); mk.textContent = "";
    $("c-markets").textContent = d.markets.length ? String(d.markets.length) : "";
    if (!d.markets.length) mk.appendChild(el("li", "empty", "Nothing shared yet."));
    d.markets.forEach(function (m) {
      var li = el("li");
      li.appendChild(el("span", "main", m.market));
      var side = el("span", "side", n(m.items) + " items · " + ago(m.updated));
      side.title = stamp(m.updated);
      li.appendChild(side);
      mk.appendChild(li);
    });

    var mem = $("members"); mem.textContent = "";
    $("c-members").textContent = String(d.members.length);
    d.members.forEach(function (m) {
      var li = el("li");
      li.appendChild(who(m.label));
      var side = el("span", "side", m.lastSeen ? "seen " + ago(m.lastSeen) : "joined " + ago(m.joined));
      side.title = "joined " + stamp(m.joined) + (m.lastSeen ? "\nlast seen " + stamp(m.lastSeen) : "");
      li.appendChild(side);
      mem.appendChild(li);
    });

    var body = $("scans"); body.textContent = "";
    $("c-scans").textContent = d.scans.length ? "last " + d.scans.length : "";
    var empty = $("scans-empty");
    if (!d.logReady) {
      empty.hidden = false;
      empty.textContent = "The upload log is not set up on this server yet: run schema.sql again in the Neon SQL editor.";
    } else if (!d.scans.length) {
      empty.hidden = false;
      empty.textContent = "No uploads logged yet. They appear here after each member's next sync.";
    } else {
      empty.hidden = true;
    }
    d.scans.forEach(function (s) {
      var tr = el("tr");
      var when = el("td", "mono", ago(s.time)); when.title = stamp(s.time); tr.appendChild(when);
      var w = el("td"); w.appendChild(who(s.label)); tr.appendChild(w);
      tr.appendChild(el("td", "market hide-sm", s.market));
      tr.appendChild(el("td", "num", n(s.items)));
      var k = el("td"); k.appendChild(el("span", s.full ? "tag full" : "tag", s.full ? "FULL HISTORY" : "UPDATE")); tr.appendChild(k);
      var sc = el("td", "mono hide-sm", s.lastScan ? ago(s.lastScan) : ""); sc.title = s.lastScan ? "AH scan " + stamp(s.lastScan) : ""; tr.appendChild(sc);
      body.appendChild(tr);
    });
    $("refreshed").textContent = "updated " + new Date().toLocaleTimeString();
  }

  function showGate(message) {
    clearInterval(timer);
    $("view").hidden = true;
    $("gate").hidden = false;
    $("gate-error").textContent = message || "";
    $("refreshed").textContent = "";
    document.title = "AuctionLens Scan Log";
    $("code").focus();
  }

  function load(first) {
    $("go").disabled = true;
    return fetch("/api/log", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: code }),
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      $("go").disabled = false;
      if (!res.ok) {
        if (first) { store(""); showGate(res.d.error || "That did not work."); }
        return;
      }
      store(code);
      render(res.d);
    }).catch(function () {
      $("go").disabled = false;
      if (first) showGate("Could not reach the server. Try again in a moment.");
    });
  }

  function open(c) {
    code = c.trim().toUpperCase();
    load(true).then(function () {
      clearInterval(timer);
      timer = setInterval(function () { if (!document.hidden) load(false); }, 60000);
    });
  }

  $("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var c = $("code").value;
    if (c.replace(/[^0-9a-z]/gi, "").length !== 8) { $("gate-error").textContent = "A join code is 8 characters, like ABCD-EFGH."; return; }
    open(c);
  });
  $("forget").addEventListener("click", function () { store(""); code = ""; $("code").value = ""; showGate(""); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && code) load(false); });

  // A link can carry the code after "#" (never sent to the server): .../#ABCD-EFGH
  var fromLink = decodeURIComponent(location.hash.slice(1));
  var saved = fromLink.replace(/[^0-9a-z]/gi, "").length === 8 ? fromLink : stored();
  if (saved) open(saved); else $("code").focus();
})();
</script>
</body>
</html>
